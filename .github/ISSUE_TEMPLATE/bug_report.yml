name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Commands or steps to reproduce the issue.
      placeholder: |
        1. Run `esq ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Environment
      description: Output of `esq --version`, OS, and Elasticsearch version.
      placeholder: |
        esq version: v0.1.0
        OS: macOS 15.2 / Ubuntu 24.04 / Windows 11
        Elasticsearch: 8.x
    validations:
      required: true
